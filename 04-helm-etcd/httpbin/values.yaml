replicaCount: 1


image: 
  repository: kennethreitz/httpbin
  pullPolicy: IfNotPresent
  tag: "broken-v999"


service:
  type: ClusterIP
  port: 80
  targetPort: 80


ingress:
  enabled: true
  host: httpbin.local


resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "100m"


env:
- name: ENVIRONMENT
  value: "lab"


serviceAccount:
  create: false
  name: ""


autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
